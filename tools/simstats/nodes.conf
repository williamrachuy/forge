# Forge compute nodes. Consumed by tools/simstats/forge_nodes.sh. See MULTI_NODE.md for the policy
# on what may and may not be offloaded.
#
# name        | host        | cores | ram_gb | workers | xmx | rate | role
#
# rate = MEASURED games/hour for this node on the standard 1v1 Battlebox NN-eval lane.
# offload splits work by RATE, not by worker count. Weighting by workers assumed every
# worker is equally fast; asus is ~3x slower per game, so a 2:1 worker split gave dell a
# 7h job and asus an 11h one -- 4 hours of the primary sitting idle waiting on the tail.
# Re-measure after any perf change and update these numbers.
#
# workers/xmx are the SAFE concurrency for that box, not its theoretical maximum. They are set by
# RAM, not cores: each sim worker is one JVM with its own heap, and run_parallel.sh's own guard
# budgets min(50% total, available) - 1g. Exceeding it trades a finished run for an OOM.
#
# dell-xps15 : 2 x 6g = 12g committed of 31g. Verified across V4-016/018d/018e/020.
# asus-vivopc: *** NOT VIABLE for the Ultron NN-eval Battlebox lane. *** Measured 2026-07-28: it
#              OOMed TWICE and then wedged in a GC death spiral (ZHeap 4084M/4096M, a full core of
#              CPU with zero games produced for 9 minutes) after 79 games in 3h51m -- ~20 games/hour,
#              half the 40 estimated. The OOM stack is transient allocation inside a pathological
#              decision (CardState$LandTraitChanges.applySpellAbility -> FCollection.add), NOT the
#              V4-022 retention leak, which stays fixed. 4g is simply too small for this workload's
#              peaks, and the box CANNOT be given more: of 15.9g installed only ~5.4g is actually
#              free (docker/containerd/netdata/chromium resident), so a 5-6g heap would page.
#              DO NOT reduce ULTRON_SIM_MAX_TOP_LEVEL_CANDIDATES or the copy budget to fit -- those
#              change the POLICY, so the node would generate a different AI's games and silently
#              confound the corpus. Heap is the only safe lever and there is no headroom for it.
#              Still usable for CHEAP lanes (all-Default corpus generation, which runs no simulation
#              search); re-evaluate for NN-eval only if the box's resident load is reduced.
#              Original 2026-07-27 note: a 4-game smoke at 1x6g drove the box to
#              12.0g/15.9g used with 951MB swapped, and the first game took 257.8s against this
#              laptop's 21s median (the second, once warm, took 24.4s). The box also carries a
#              resident docker/containerd/netdata load. 6g was too aggressive; 4g leaves headroom
#              so the heap is not paged. Do NOT raise workers to 2 without re-measuring free RAM --
#              2 workers would exceed what is actually free and re-summon the OOM this project
#              spent weeks killing.

dell-xps15   | local       | 8     | 31     | 2       | 6g  | 119  | primary
asus-vivopc  | asus-vivopc | 4     | 15     | 1       | 4g  | 20   | UNSUITABLE-for-nn-eval
