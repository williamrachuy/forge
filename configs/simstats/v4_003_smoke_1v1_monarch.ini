[run]
name=v4_003_smoke_1v1_monarch
games=10
seed=910123
; 1v1 Monarch Battlebox. Chosen over 4-player FFA as the FIRST training/measurement lane to
; avoid board inflation: TICKET-V4-001/V4-002 established that the dominant remaining cost
; (static-ability / replacement-effect recomputation) scales with permanent count, and a 2-player
; board is roughly half the size of a 4-player one. Faster games also mean more training samples
; per hour for the ULTRON-V4 value network. See ULTRON_V4_NEURAL_PLAN.md §5.3.
timeoutSeconds=900
outputDir=/home/william/github/forge/simstats/out/v4_003_smoke_1v1_monarch

[game]
format=Battlebox
players=2
deck=BattleBox.dck
; rotateSeats cycles Ultron between seat 0 and seat 1 across games so the play/draw advantage
; does not confound the win rate. NOTE: the 1v1 null hypothesis is 50%, not the 4-player 25% —
; gate.py comparisons must use the right null for this lane.
aiProfiles=Ultron, Default
battleboxMonarch=true
rotateSeats=true

[stats]
enabled=true
turnSnapshots=false

[sim]
aiDecisionTimeoutSeconds=60
adaptiveWeights=false

; Same sim-only exclusions as the 4-player lanes (BUG-007) so the card pool stays identical
; across every measurement lane.
bannedCards=Nadu, Winged Wisdom; Scute Swarm; Mystic Forge
