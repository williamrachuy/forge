[run]
name=battlebox_monarch_4p_ultron
games=200
seed=123456
; Per-game wall-clock kill limit in seconds. Games exceeding this are ended as draws.
; 600s kills runaway token/recursion boards while leaving normal games (~100-400s) intact.
; Set to 0 to disable. Default if omitted: 600.
timeoutSeconds=600
outputDir=/home/william/github/forge/simstats/out/battlebox_monarch_4p_ultron

[game]
format=Battlebox
players=4
deck=BattleBox.dck
; Seat 0: Ultron AI profile. Seats 1-3: Forge default AI.
aiProfiles=Ultron, Default, Default, Default
battleboxMonarch=true

[stats]
enabled=true
turnSnapshots=true

[sim]
; Per-AI-decision timeout in seconds (default 60). The hardcoded game default is 5s,
; which causes timeout storms on complex 4-player boards — each timeout wastes 5s and
; leaves a zombie thread. 60s lets the Default AI evaluator finish properly.
; Reduced from 60 to 10: shorter evals mean AI eval threads hold fewer card references
; before timing out. With join(3000) cleanup, 10s evals reliably terminate within 3s,
; preventing Old Gen heap saturation over long runs.
aiDecisionTimeoutSeconds=10
; Set adaptiveWeights=true to enable post-game weight learning.
; Ultron will nudge scoring multipliers after each completed game and persist them.
; Delete ~/.forge/ultron-learning/weights.json to reset to baseline at any time.
adaptiveWeights=true
weightsPath=/home/william/.forge/ultron-learning/weights.json
