[run]
name=v4_012_gate_nn_1v1_monarch
; THE GATE (ULTRON_V4_NEURAL_PLAN.md §5.4): does the learned NeuralStateEvaluator beat Default?
; Ultron (NN eval) vs Default, 1v1 Monarch, seat-rotated. Launch with:
;   ULTRON_NN_EVAL=true ULTRON_NN_MODEL_PATH=/home/william/github/forge/tools/nn/runs/20260724-195756/model.bin \
;   FORGE_SKIP_GROOM=1 bash tools/simstats/run_parallel.sh configs/simstats/v4_012_gate_nn_1v1_monarch.ini --workers 2 --xmx 6g
; Gate the result with the CORRECT 1v1 null (0.50, NOT the 4-player 0.25):
;   python3 tools/simstats/gate.py <outputDir>/games.jsonl --profile Ultron --null 0.5 --min-games 150
;
; N and repeat are provisional pending the V4-011 smoke's per-game timing. Placeholder N=300
; (detects ~58%+ vs the 0.50 null at p<0.05 with usable power). `repeat` batches each shard's JVM
; so a residual OOM (should be none post-V4-011, but belt-and-suspenders) loses at most one batch
; instead of a whole shard -- games.jsonl appends across batches. FINALIZE games/repeat from the
; smoke's measured per-game seconds before launching (slow deadline-capped games may make 300 a
; multi-hour job -- size accordingly, or raise --workers now that the box is 8 cores).
games=300
repeat=1
; Seed DISTINCT from the v4_007 training corpus (20260724) AND from every prior measurement lane
; (910123) -- the gate must not share games with training data (leakage) or reuse smoke seeds.
seed=20260725
timeoutSeconds=900
outputDir=/home/william/github/forge/simstats/out/v4_012_gate_nn_1v1_monarch

[game]
format=Battlebox
players=2
aiProfiles=Ultron, Default
deck=BattleBox.dck
battleboxMonarch=true
rotateSeats=true

[stats]
enabled=true
turnSnapshots=false
; nnLogging left OFF for the gate -- we are measuring win rate, not harvesting training data, and
; logging costs ~21% throughput (TICKET-V4-006). A later expert-iteration corpus run turns it on.

[sim]
aiDecisionTimeoutSeconds=60
adaptiveWeights=false

bannedCards=Nadu, Winged Wisdom; Scute Swarm; Mystic Forge
