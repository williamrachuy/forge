[run]
name=v3_control_default_4p
games=500
seed=910123
; Per-game wall-clock kill limit in seconds. Games exceeding this are ended as draws.
timeoutSeconds=1200
outputDir=/home/william/github/forge/simstats/out/v3_control_default_4p

[game]
format=Battlebox
players=4
deck=BattleBox.dck
; All-Default control lane. Seat rotation is harmless here (every seat is Default) but is
; left on so this config is a true structural mirror of v3_ultron_vs_default_4p.ini — same
; seeds, same rotation mechanics, only the profile list differs.
aiProfiles=Default, Default, Default, Default
battleboxMonarch=true
rotateSeats=true

[stats]
enabled=true
turnSnapshots=false

[sim]
aiDecisionTimeoutSeconds=60
adaptiveWeights=false

; Sim-only exclusions — see FORGE_TRACKER BUG-007. Kept identical to the adaptive v2 config
; so the control and candidate lanes share the exact same card pool.
; Nadu, Winged Wisdom: infinite land-trigger loops
; Scute Swarm: exponential token creation with active land station
; Mystic Forge: AI loops evaluating cast-from-top every priority pass
bannedCards=Nadu, Winged Wisdom; Scute Swarm; Mystic Forge
