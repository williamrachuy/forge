; (20260726..20260731) and training corpus (20260724). timeoutSeconds=360 per V4-016's finding
; that 900s made monster-game exposure WORSE (more monster-seconds per game before kill).
; Launch: ULTRON_NN_EVAL=true ULTRON_NN_MODEL_PATH=/home/william/github/forge/tools/nn/runs/20260724-195756/model.bin \
;   ULTRON_SIM_MAX_TOP_LEVEL_CANDIDATES=4 FORGE_SKIP_GROOM=1 \
;   bash tools/simstats/run_simstats.sh configs/simstats/v4_017_monster_diag_1v1.ini
games=30
seed=71059913
timeoutSeconds=360
outputDir=/home/william/github/forge/simstats/out/v4_017_monster_diag_1v1

[game]
