[run]
name=battlebox_monarch_4p_ultron_adaptive
games=50
repeat=3
timeoutSeconds=1200
outputDir=/home/william/github/forge/simstats/out/battlebox_monarch_4p_ultron_adaptive

[game]
format=Battlebox
players=4
deck=BattleBox.dck
; Seat 0: Ultron AI profile. Seats 1-3: Forge default AI.
aiProfiles=Ultron, Default, Default, Default
battleboxMonarch=true

[stats]
enabled=true
turnSnapshots=false

[sim]
aiDecisionTimeoutSeconds=60
adaptiveWeights=true
; weightsPath=/home/william/.forge/ultron-learning/weights.json

; Cards that cause near-infinite trigger chains or exponential game-state growth in
; headless sim, leading to 600s timeouts and OOM. Excluded from the card pool for
; sim runs only — still present in BattleBox.dck for normal play.
; Nadu, Winged Wisdom: banned in Legacy for infinite land-trigger loops
; Scute Swarm: exponential token creation mid-turn with active land station
; Mystic Forge: AI loops evaluating cast-from-top every priority pass
; Wishclaw Talisman: tutor causes repeated AI-eval timeouts (search decision loops)
bannedCards=Nadu, Winged Wisdom; Scute Swarm; Mystic Forge; Wishclaw Talisman
