[run]
name=v4_007_bootstrap_corpus
games=8000
; Stage A bootstrap corpus (ULTRON_V4_NEURAL_PLAN.md §6 P2.1): all-Default 1v1 Monarch Battlebox,
; outcome-labelled states for training the V0 value network. All-Default deliberately — the
; bootstrap corpus needs NO Ultron simulation search, which is what makes it immune to the
; abandoned-worker OOM documented in TICKET-V4-003.
; Expected yield at ~38 perspective-samples/game: ~300K samples. Expected wall time at
; ~215 games/hr/worker x 2 workers: ~19 hours.
; Seed deliberately DIFFERENT from the 910123 used by every measurement lane, so the training
; corpus and the evaluation lanes never share games — training on the games you later gate
; against would be leakage.
seed=20260724
timeoutSeconds=900
outputDir=/home/william/github/forge/simstats/out/v4_007_bootstrap_corpus

[game]
format=Battlebox
players=2
deck=BattleBox.dck
aiProfiles=Default, Default
battleboxMonarch=true
rotateSeats=false

[stats]
enabled=true
turnSnapshots=false
nnLogging=true

[sim]
aiDecisionTimeoutSeconds=60
adaptiveWeights=false

bannedCards=Nadu, Winged Wisdom; Scute Swarm; Mystic Forge
