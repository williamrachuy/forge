[run]
name=v4_018b_v1_corpus_default
; V1 bootstrap corpus (V4-018b): all-Default 1v1 Monarch, MULTI-PHASE logging (V4-018a).
; All-Default deliberately: no Ultron sim path = no monster/hang tax = clean fast run (~16s/game).
; Directly tests the blind-spot hypothesis by changing ONE variable vs V0's corpus: phase coverage
; (V0 was MAIN1-only; this captures MAIN1/MAIN2/both combat phases, ~85 records/game).
; Seed distinct from V0's corpus (20260724) and every measurement lane.
games=1500
seed=30260726
timeoutSeconds=900
outputDir=/home/william/github/forge/simstats/out/v4_018b_v1_corpus_default

[game]
format=Battlebox
players=2
aiProfiles=Default, Default
deck=BattleBox.dck
battleboxMonarch=true
rotateSeats=false

[stats]
enabled=true
turnSnapshots=false
nnLogging=true

[sim]
aiDecisionTimeoutSeconds=60
adaptiveWeights=false

bannedCards=Nadu, Winged Wisdom; Scute Swarm; Mystic Forge
