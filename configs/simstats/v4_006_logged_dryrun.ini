[run]
name=v4_006_logged_dryrun
games=20
seed=910123
; End-to-end verification of the NN state logger (TICKET-V4-006, plan §6 P1.3).
; DELIBERATELY identical to v4_004_default_1v1_corpus.ini except stats.nnLogging=true — same
; seed, same game count, same profiles — so this is a PAIRED comparison: the exact same 20 games
; run with and without logging. Any throughput difference is attributable to the logger, not to
; game-to-game variance. Baseline to beat: 20/20 completed, median 13s/game, ~237 games/hour/worker.
timeoutSeconds=900
outputDir=/home/william/github/forge/simstats/out/v4_006_logged_dryrun

[game]
format=Battlebox
players=2
deck=BattleBox.dck
