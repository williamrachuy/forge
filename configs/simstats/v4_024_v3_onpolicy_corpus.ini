[run]
name=v4_024_v3_onpolicy_corpus
; TICKET-V4-024: expert iteration ROUND 2. Identical to V4-020 except the driving model is V2
; (v4_007_bootstrap_corpus, 142,229 records / 7,996 all-Default-vs-Default games): the STATE
; DISTRIBUTION. Ultron (V0 model) vs Default, 1v1 Monarch, seat-rotated -- Ultron's own policy now
; generates the states the value net trains on, instead of off-policy Default-vs-Default games.
; Everything else matches V0's pipeline exactly: MAIN1-only logging (stats.nnLoggingPhases=main1,
; TICKET-V4-024: expert iteration ROUND 2. Identical to V4-020 except the driving model is V2
; pruning ON (the runtime V0's 37.3% headline was measured on -- TICKET-V4-018e), depth-0 + the
; existing copy budget (unchanged).
;
; Launch with (matches the proven v4_012/v4_016/v4_018e Ultron-NN-eval invocation):
;   ULTRON_NN_EVAL=true ULTRON_NN_MODEL_PATH=/home/william/github/forge/tools/nn/runs/20260724-195756/model.bin \
;   ULTRON_SIM_MAX_TOP_LEVEL_CANDIDATES=4 FORGE_SKIP_GROOM=1 \
;   bash tools/simstats/run_parallel.sh configs/simstats/v4_024_v3_onpolicy_corpus.ini --workers 2 --xmx 6g
;
; Seed distinct from V0's corpus (20260724), V1's corpus (30260726), and every gate lane
; (20260725..20260731, 20260725e).
games=300
seed=40260726
timeoutSeconds=360
outputDir=/home/william/github/forge/simstats/out/v4_024_v3_onpolicy_corpus

[game]
format=Battlebox
players=2
aiProfiles=Ultron, Default
deck=BattleBox.dck
battleboxMonarch=true
rotateSeats=true

[stats]
enabled=true
turnSnapshots=false
nnLogging=true
nnLoggingPhases=main1

[sim]
aiDecisionTimeoutSeconds=60
adaptiveWeights=false

bannedCards=Nadu, Winged Wisdom; Scute Swarm; Mystic Forge
