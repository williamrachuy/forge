[run]
name=v3_ultron_vs_default_4p
games=500
seed=910123
; Per-game wall-clock kill limit in seconds. Games exceeding this are ended as draws.
timeoutSeconds=1200
outputDir=/home/william/github/forge/simstats/out/v3_ultron_vs_default_4p

[game]
format=Battlebox
players=4
deck=BattleBox.dck
; Ultron + 3x Default. rotateSeats=true cycles Ultron through every seat across the run —
; do not read win rate by fixed seat 0; use tools/simstats/gate.py --profile Ultron, which
; reads the per-game run.aiProfiles list to find Ultron's seat that game.
aiProfiles=Ultron, Default, Default, Default
battleboxMonarch=true
rotateSeats=true

[stats]
enabled=true
turnSnapshots=false

[sim]
aiDecisionTimeoutSeconds=60
adaptiveWeights=false

; Sim-only exclusions — see FORGE_TRACKER BUG-007. Kept identical to the control config so
; both lanes share the exact same card pool (same seeds too — true paired comparison).
; Nadu, Winged Wisdom: infinite land-trigger loops
; Scute Swarm: exponential token creation with active land station
; Mystic Forge: AI loops evaluating cast-from-top every priority pass
bannedCards=Nadu, Winged Wisdom; Scute Swarm; Mystic Forge
